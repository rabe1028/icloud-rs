[workspace]
members = ["crates/icloud-types", "crates/icloud-protocol", "crates/icloud-client"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/rabe1028/icloud-rs"
rust-version = "1.88"
version = "0.1.8"

[workspace.dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
cookie = { version = "0.18.1", default-features = false }
http = { version = "1.3.1", default-features = false }
pretty_assertions = "1.4.1"
reqwest = { version = "0.12.15", default-features = false }
secrecy = { version = "0.10.3", default-features = false }
nojson = { version = "0.3.12", default-features = false }
thiserror = { version = "2.0.12", default-features = false }
time = { version = "0.3.41", default-features = false, features = ["alloc", "macros", "parsing"] }
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread"] }
url = { version = "2.5.4", default-features = false }
uuid = { version = "1.17.0", default-features = false, features = ["v4"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
clone_on_ref_ptr = "warn"
dbg_macro = "deny"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
todo = "warn"
wildcard_dependencies = "deny"
